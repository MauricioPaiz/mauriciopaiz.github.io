<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pedro Liska</title>
    <style>
        body {
            color: #111;
            font-family: monospace;
            margin: 10px;
            padding: 0;
            font-size: 1rem;
            line-height: 1.6;
        }

        h1 {
            font-size: 2.5rem;
        }

        div#content {
            margin: 50px auto;
            max-width: 450px;
        }

        a {
            color: #000;
            text-decoration: underline;
            text-decoration-thickness: 1px;
            transition: color 0.2s ease;
        }

        a:hover {
            color: #888888;
        }

        @media (prefers-color-scheme: dark) {
            body {
                background: black;
                color: white;
                outline: 5px dashed black;
            }

            a {
                color: white;
            }

            a:hover {
                color: #CCC;
            }
        }
    </style>
</head>

<body>
    <div id="content">
        <h1>Mauricio Paiz</h1>
        <p>
            I’m a photographer based in Florida. You can find me on
            <a href="https://instagram.com/mauriciopaiz">Instagram</a>.
        </p>
    </div>
</body>

</html>
